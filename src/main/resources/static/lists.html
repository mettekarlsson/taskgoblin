<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Lists | TaskGoblin</title>

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/lists.css">
</head>
<body>
<header>
    <img
            src="/images/logo.png"
            alt="TaskGoblin logo"
            class="app-logo"
    />

    <!-- Hamburger button -->
    <button class="hamburger-btn" id="menu-btn">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <!-- Close button -->
        <button class="close-btn" id="close-btn">
            ×
        </button>
        <!-- Top image -->
        <img
                src="/images/MenuHeader.png"
                alt="Menu decoration"
                class="menu-header"
        >

        <!-- Navigation -->
        <nav class="sidebar-links">

            <a href="/index.html">Home</a>
            <a href="/profile.html">Profile</a>
            <a href="/tasks.html">Tasks</a>
            <a href="/lists.html">Lists</a>
            <a href="/notes.html">Notes</a>
            <a href="/calendar.html">Calendar</a>
            <a href="/settings.html">Settings</a>

        </nav>

        <!-- Bottom image -->
        <img
                src="/images/MenuFooter.png"
                alt="Menu decoration"
                class="menu-footer"
        >

    </aside>
</header>
<main class="list-page">

    <!-- List content -->
    <section class="list-container">

        <h1>Lists</h1>

        <div id="list-content">
            Loading lists...
        </div>

    </section>

</main>

<footer>
    <div class="quick-add-menu" id="quick-add-menu">

        <!-- Add task -->
        <button class="quick-add-option">

        <span class="quick-add-icon task-icon">

            <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            >
                <circle cx="12" cy="12" r="10"/>
                <path d="m9 12 2 2 4-4"/>
            </svg>

        </span>

            <span>Add task</span>

        </button>

        <!-- Add note -->
        <button class="quick-add-option">

        <span class="quick-add-icon note-icon">

            <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            >
                <path d="M12 20h9"/>
                <path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>
            </svg>

        </span>

            <span>Add note</span>

        </button>

        <!-- Add list -->
        <button class="quick-add-option">

        <span class="quick-add-icon list-icon">

            <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            >
                <path d="M8 6h13"/>
                <path d="M8 12h13"/>
                <path d="M8 18h13"/>
                <path d="M3 6h.01"/>
                <path d="M3 12h.01"/>
                <path d="M3 18h.01"/>
            </svg>

        </span>

            <span>Add list</span>

        </button>

        <!-- Add event -->
        <button class="quick-add-option">

        <span class="quick-add-icon event-icon">

            <svg
                    xmlns="http://www.w3.org/2000/svg"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
            >
                <path d="M8 2v4"/>
                <path d="M16 2v4"/>
                <rect width="18" height="18" x="3" y="4" rx="2"/>
                <path d="M3 10h18"/>
            </svg>

        </span>

            <span>Add event</span>

        </button>

    </div>

    <!-- Quick add button -->
    <button class="quick-add-btn" id="quick-add-btn">
        <span></span>
    </button>
</footer>

<script src="/js/api.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/lists.js"></script>

</body>
</html>
