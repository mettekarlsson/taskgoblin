<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Calendar | TaskGoblin</title>

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/calendar.css">
</head>
<body>

<header id="app-header"></header>

<main class="calendar-page">

    <!-- Page header -->
    <section class="calendar-header">

        <div class="calendar-header-text">

            <h1 data-translate="calendar">
                Calendar
            </h1>

            <p class="calendar-subtitle">
                Keep track of your events.
            </p>

        </div>


        <div class="calendar-header-actions">

            <button
                    class="calendar-search-btn"
                    onclick="toggleCalendarSearch()"
            >
                🔍
            </button>

            <button
                    class="new-event-btn"
                    onclick="renderCreateEventForm()"
            >
                + New event
            </button>

        </div>

    </section>

    <section
            class="calendar-search-view"
            id="calendar-search-view"
    >
        <input
                id="event-list-search"
                class="calendar-search-input"
                type="text"
                placeholder="Search events..."
                oninput="renderEventList()"
        >
    </section>

    <!-- Month / List switch -->
    <section class="calendar-view-tabs">

        <button
                class="calendar-view-tab active"
                data-view="month"
                onclick="switchCalendarView('month')"
        >
            Month
        </button>

        <button
                class="calendar-view-tab"
                data-view="list"
                onclick="switchCalendarView('list')"
        >
            List
        </button>

    </section>

    <!-- Calendar -->
    <section class="calendar-container">


        <!-- Month navigation -->
        <div class="calendar-toolbar">

            <button
                    class="calendar-nav-btn"
                    onclick="changeCalendarMonth(-1)"
                    aria-label="Previous month"
            >
                ‹
            </button>


            <h2 id="calendar-month-label"></h2>


            <button
                    class="calendar-nav-btn"
                    onclick="changeCalendarMonth(1)"
                    aria-label="Next month"
            >
                ›
            </button>

        </div>

        <!-- Weekdays -->
        <div
                class="calendar-weekdays"
                id="calendar-weekdays"
        ></div>

        <!--
            JS replaces Loading calendar...
            when calendar has rendered.
        -->
        <div
                class="calendar-grid"
                id="calendar-content"
        >
            <p class="calendar-loading">
                Loading calendar...
            </p>
        </div>

    </section>

    <!-- Day view - shown when a day is clicked -->
    <section class="calendar-day-view" id="calendar-day-view">
    </section>

    <!-- List view -->
    <section class="event-list-container" id="event-list-container">

        <div id="event-list-content">
            <p class="calendar-loading">
                Loading events...
            </p>
        </div>

        <button
                type="button"
                class="event-list-load-more-btn"
                id="event-list-load-more-btn"
                onclick="loadMoreEventList()"
        >
            Load more
        </button>

    </section>

</main>


<footer id="app-footer"></footer>

<div class="modal" id="event-detail-modal">

    <div class="modal-content">

        <button
                type="button"
                class="modal-close-btn"
                onclick="closeEventDetail()"
                aria-label="Close"
        >
            ×
        </button>


        <h2 id="modal-event-title"></h2>

        <div id="modal-event-details"></div>


        <div class="modal-actions">

            <button
                    type="button"
                    class="event-edit-btn"
                    onclick="renderEditEventForm()"
            >
                Edit
            </button>


            <button
                    type="button"
                    class="event-delete-btn"
                    onclick="deleteEvent()"
            >
                Delete
            </button>

        </div>

    </div>

</div>

<script src="/js/auth.js"></script>
<script src="/js/translations.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/calendar.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
