<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Today | TaskGoblin</title>

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/today.css">
</head>

<body>

<header id="app-header"></header>

<main class="today-page">

    <header class="today-header">
        <div>
            <h1>Today</h1>
            <p>Your overview for today.</p>
        </div>
    </header>


    <div class="today-date-card">
        <div class="today-date">
            <span class="today-date-icon">📅</span>
        </div>

        <span class="today-date-message"></span>
    </div>


    <!-- EVENTS -->
    <section class="today-section">

        <div class="today-section-title">
            <span>Events</span>
            <span class="today-section-count"></span>
        </div>

        <div class="today-section-list" id="today-events"></div>

    </section>


    <!-- TASKS -->
    <section class="today-section">

        <div class="today-section-title">
            <span>Tasks</span>
            <span class="today-section-count"></span>
        </div>

        <div class="today-section-list">
        </div>

    </section>


    <!-- LISTS -->
    <section class="today-section">

        <div class="today-section-title">
            <span>Lists</span>
            <span class="today-section-count"></span>
        </div>

        <div class="today-section-list">
        </div>

    </section>


    <!-- OVERDUE -->
    <section class="today-section overdue">

        <div class="today-section-title">
            <span>Overdue</span>
            <span class="today-section-count"></span>
        </div>

        <div class="today-section-list">
        </div>

    </section>

</main>

<footer id="app-footer"></footer>

<script src="/js/auth.js"></script>
<script src="/js/translations.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/today.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
