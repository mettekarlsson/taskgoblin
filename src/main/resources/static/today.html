<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Today | TaskGoblin</title>

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/today.css">
</head>

<body>
<header id="app-header"></header>

<main class="today-page">

    <header class="today-header">
        <div>
            <h1>Today</h1>
            <p>Your overview for today.</p>
        </div>

    </header>


    <div class="today-date-card">
        <div class="today-date">
            <span class="today-date-icon">📅</span>
            Thursday 20 August
        </div>

        <span class="today-date-message">
            Have a great day!
        </span>
    </div>


    <!-- EVENTS -->
    <section class="today-section">

        <div class="today-section-title">
            <span>Events</span>
            <span class="today-section-count">2</span>
        </div>

        <div class="today-section-list">

            <div class="today-row">
                <span class="today-event-time">09:00</span>

                <div class="today-row-main">
                    <span class="today-row-title">
                        Team meeting
                    </span>
                </div>

                <span class="today-row-arrow">›</span>
            </div>

        </div>
    </section>


    <!-- TASKS -->
    <section class="today-section">

        <div class="today-section-title">
            <span>Tasks</span>
            <span class="today-section-count">3</span>
        </div>

        <div class="today-section-list">

            <div class="today-row today-task">

                <button class="today-task-check"></button>

                <div class="today-row-main">
                    <span class="today-row-title">
                        Finish project report
                    </span>
                </div>

                <div class="today-row-meta">
                    <span class="today-category">
                        Work
                    </span>

                    <span class="today-row-arrow">›</span>
                </div>

            </div>

        </div>
    </section>


    <!-- LISTS -->
    <section class="today-section">

        <div class="today-section-title">
            <span>Lists</span>
            <span class="today-section-count">1</span>
        </div>

        <div class="today-section-list">

            <div class="today-row">

                <span class="today-list-icon">☷</span>

                <div class="today-row-main">
                    <span class="today-row-title">
                        Morning routine
                    </span>
                </div>

                <div class="today-row-meta">
                    <span class="today-category">
                        Routine
                    </span>

                    <span class="today-row-arrow">›</span>
                </div>

            </div>

        </div>
    </section>


    <!-- OVERDUE -->
    <section class="today-section overdue">

        <div class="today-section-title">
            <span>Overdue</span>
            <span class="today-section-count">1</span>
        </div>

        <div class="today-section-list">

            <div class="today-row today-overdue-row">

                <button class="today-task-check"></button>

                <div class="today-row-main">
                    <span class="today-row-title">
                        Submit application
                    </span>

                    <span class="today-overdue-label">
                        Due yesterday
                    </span>
                </div>

                <span class="today-row-arrow">›</span>

            </div>

        </div>
    </section>


    <!-- OPTIONAL -->
    <div class="today-tip">
        <span class="today-tip-icon">🌿</span>

        <div class="today-tip-content">
            <span class="today-tip-title">
                Take it one step at a time.
            </span>

            <span class="today-tip-text">
                You've got this!
            </span>
        </div>
    </div>

</main>

<footer id="app-footer"></footer>

<script src="/js/auth.js"></script>
<script src="/js/translations.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/today.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
