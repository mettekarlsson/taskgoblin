<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Tasks | TaskGoblin</title>

    <link rel="stylesheet" href="/css/theme.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/layout.css">
    <link rel="stylesheet" href="/css/tasks.css">
</head>
<body>

<header id="app-header"></header>

<main class="task-page">

    <!-- Note content -->
    <section class="task-container">

        <div class="task-topbar">

            <div>

                <h1 class="task-title"
                    data-translate="tasks"
                >
                    Tasks
                </h1>

                <p class="task-subtitle"
                   data-translate="taskSubtitle"
                >
                    Keep track of your tasks.
                </p>

            </div>

            <div class="task-top-actions">

                <button class="task-search-btn">
                    🔍
                </button>

                <button
                        class="task-new-btn"
                        onclick="renderCreateTaskForm()"
                        data-translate="newTask">
                    + New task
                </button>

            </div>

        </div>

        <div class="task-filters">

            <button class="task-filter active"
                    data-translate="all"
            >
                All
            </button>

            <button class="task-filter"
                    data-translate="today"
            >
                Today
            </button>

            <button class="task-filter"
                    data-translate="upcoming"
            >
                Upcoming
            </button>

            <button class="task-filter"
                    data-translate="completed"
            >
                Completed
            </button>

        </div>

        <div id="task-content">
            Loading tasks...
        </div>

    </section>

</main>

<footer id="app-footer"></footer>

<script src="/js/auth.js"></script>
<script src="/js/translations.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/menu.js"></script>
<script src="/js/tasks.js"></script>
<script src="/js/app.js"></script>

</body>
</html>
